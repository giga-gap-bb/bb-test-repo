name: Reusable OIDC
on:
  workflow_call:
permissions:
  id-token: write
  contents: read
jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bb-test")
          echo "HTTP=$HTTP"
          cat /tmp/resp.json
          echo ""
          python3 /dev/stdin << 'EOF'
          import base64, json
          val = json.load(open('/tmp/resp.json'))['value']
          p = val.split('.')[1]
          p += '=' * (-len(p) % 4)
          print("CLAIMS=" + json.dumps(json.loads(base64.urlsafe_b64decode(p))))
          EOF
