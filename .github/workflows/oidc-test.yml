name: OIDC Test
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('bb-test');
            console.log('TOKEN_PREFIX=' + token.substring(0, 40));
            return token.length;
      - name: Done
        run: echo "ok"
