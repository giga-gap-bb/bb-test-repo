name: OIDC Test
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token
        env:
          TOKEN: ${{ actions/id-token }}
        run: |
          # récupérer le token depuis l'endpoint métadonnées
          TOKEN=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bb-test" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "TOKEN_LEN=$(echo -n $TOKEN | wc -c)"
          echo "$TOKEN" | cut -c1-50
