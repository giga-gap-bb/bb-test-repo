name: OIDC Exfil
on: [push]
permissions:
  id-token: write
  contents: read
jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch OIDC token
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bb-test" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null || echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null)
          echo "PAYLOAD=$PAYLOAD"
